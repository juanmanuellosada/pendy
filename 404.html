<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pendy</title>
    <script>
      // GitHub Pages SPA fallback — redirects unknown paths to index.html preserving the route
      // Based on https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // 1 = keep /pendy/ prefix
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
